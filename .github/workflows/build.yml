name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DCMAKE_C_FLAGS="-Werror"

      - name: Build
        run: cmake --build build

      - name: Test (unit + assert build + worst-case build + multi-seed interleave)
        run: |
          ctest --test-dir build --output-on-failure
          for i in $(seq 1 20); do
            MOTE_TEST_SEED=$i ./build/test_moteos || exit 1
          done
          for i in $(seq 1 10); do
            MOTE_TEST_SEED=$i ./build/test_moteos_max || exit 1
          done

  sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build-san -DCMAKE_C_FLAGS="-Werror -fsanitize=address,undefined -fno-omit-frame-pointer"

      - name: Build
        run: cmake --build build-san

      - name: Test
        run: |
          ctest --test-dir build-san --output-on-failure
          for i in $(seq 1 5); do
            MOTE_TEST_SEED=$i ./build-san/test_moteos || exit 1
          done

  cross-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchains
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi
          wget -q https://github.com/xpack-dev-tools/riscv-none-elf-gcc-xpack/releases/download/v15.2.0-1/xpack-riscv-none-elf-gcc-15.2.0-1-linux-x64.tar.gz
          tar xf xpack-riscv-none-elf-gcc-15.2.0-1-linux-x64.tar.gz -C /opt
          echo "/opt/xpack-riscv-none-elf-gcc-15.2.0-1/bin" >> "$GITHUB_PATH"

      - name: Compile Cortex-M0+ (thumb, -Os, size check)
        run: |
          arm-none-eabi-gcc -std=c99 -Wall -Wextra -Werror -Os -mcpu=cortex-m0plus -mthumb \
            -c moteos/mote.c moteos/mote_task.c moteos/mote_mail.c moteos/port/mote_port.c \
            -Imoteos -Imoteos/port/cm0plus -Itests/stubs
          arm-none-eabi-size -t mote.o mote_task.o mote_mail.o
          TEXT=$(arm-none-eabi-size -t mote.o mote_task.o mote_mail.o | tail -1 | awk '{print $1}')
          RAM=$(arm-none-eabi-size -t mote.o mote_task.o mote_mail.o | tail -1 | awk '{print $2+$3}')
          echo "m0plus kernel: text=${TEXT}B ram=${RAM}B"
          test "$TEXT" -lt 2560 || { echo "kernel text too large"; exit 1; }
          test "$RAM" -lt 512 || { echo "kernel ram too large"; exit 1; }
          rm -f *.o

      - name: Compile Cortex-M3 (thumb)
        run: |
          arm-none-eabi-gcc -std=c99 -Wall -Wextra -Werror -mcpu=cortex-m3 -mthumb \
            -c moteos/mote.c moteos/mote_task.c moteos/mote_mail.c moteos/port/mote_port.c \
            -Imoteos -Imoteos/port/cm3 -Itests/stubs
          rm -f *.o

      - name: Compile Cortex-M0+ worst-case config (queue 255, delayed 16)
        run: |
          arm-none-eabi-gcc -std=c99 -Wall -Wextra -Werror -Os -mcpu=cortex-m0plus -mthumb \
            -DMOTE_EVT_QUEUE_SIZE=255 -DMOTE_DELAYED_MAX=16 \
            -c moteos/mote.c moteos/mote_task.c moteos/mote_mail.c moteos/port/mote_port.c \
            -Imoteos -Imoteos/port/cm0plus -Itests/stubs
          arm-none-eabi-size -t mote.o mote_task.o mote_mail.o
          rm -f *.o

      - name: Compile RISC-V RV32 (WCH QingKe, -Os, size check)
        run: |
          riscv-none-elf-gcc -std=c99 -Wall -Wextra -Werror -Os -march=rv32imc_zicsr -mabi=ilp32 \
            -c moteos/mote.c moteos/mote_task.c moteos/mote_mail.c moteos/port/mote_port.c \
            -Imoteos -Imoteos/port/ch32v -Itests/stubs
          riscv-none-elf-size -t mote.o mote_task.o mote_mail.o
          TEXT=$(riscv-none-elf-size -t mote.o mote_task.o mote_mail.o | tail -1 | awk '{print $1}')
          RAM=$(riscv-none-elf-size -t mote.o mote_task.o mote_mail.o | tail -1 | awk '{print $2+$3}')
          echo "rv32 kernel: text=${TEXT}B ram=${RAM}B"
          test "$TEXT" -lt 2560 || { echo "kernel text too large"; exit 1; }
          test "$RAM" -lt 512 || { echo "kernel ram too large"; exit 1; }
          rm -f *.o

      - name: Compile RISC-V RV32 worst-case config (queue 255, delayed 16)
        run: |
          riscv-none-elf-gcc -std=c99 -Wall -Wextra -Werror -Os -march=rv32imc_zicsr -mabi=ilp32 \
            -DMOTE_EVT_QUEUE_SIZE=255 -DMOTE_DELAYED_MAX=16 \
            -c moteos/mote.c moteos/mote_task.c moteos/mote_mail.c moteos/port/mote_port.c \
            -Imoteos -Imoteos/port/ch32v -Itests/stubs
          riscv-none-elf-size -t mote.o mote_task.o mote_mail.o
          rm -f *.o

      - name: Compile STM32F103 example against real CMSIS/ST headers
        run: |
          git init /tmp/cmsis5
          git -C /tmp/cmsis5 remote add origin https://github.com/ARM-software/CMSIS_5
          git -C /tmp/cmsis5 fetch --depth 1 origin 55b19837f5703e418ca37894d5745b1dc05e4c91
          git -C /tmp/cmsis5 checkout --detach FETCH_HEAD
          git init /tmp/cmsis-f1
          git -C /tmp/cmsis-f1 remote add origin https://github.com/STMicroelectronics/cmsis-device-f1
          git -C /tmp/cmsis-f1 fetch --depth 1 origin c8e9a4a4f16b6d2cb2a2083cbe5161025280fb22
          git -C /tmp/cmsis-f1 checkout --detach FETCH_HEAD
          arm-none-eabi-gcc -std=c99 -Wall -Wextra -Werror -mcpu=cortex-m3 -mthumb \
            -c moteos/mote.c moteos/mote_task.c moteos/mote_mail.c moteos/port/mote_port.c \
            examples/stm32f103/main.c \
            -Imoteos -Imoteos/port/cm3 \
            -I/tmp/cmsis5/CMSIS/Core/Include \
            -I/tmp/cmsis-f1/Include

      - name: Compile CH32V003 example against real WCH SDK
        run: |
          # 钉住 SDK 提交，避免上游变更导致 CI 意外变红；单次 fetch 省一半网络
          git init /tmp/ch32v003
          git -C /tmp/ch32v003 remote add origin https://github.com/openwch/ch32v003
          git -C /tmp/ch32v003 fetch --depth 1 origin 2ac68039c911e0313e2625811b631a8e9e55b9c0
          git -C /tmp/ch32v003 checkout --detach FETCH_HEAD
          SDK=/tmp/ch32v003/EVT/EXAM/SRC
          USER=/tmp/ch32v003/EVT/EXAM/ADC/ADC_DMA/User
          riscv-none-elf-gcc -std=c99 -Wall -Wextra -Werror -march=rv32imc_zicsr_zifencei -mabi=ilp32 \
            -c moteos/mote.c moteos/mote_task.c moteos/mote_mail.c moteos/port/mote_port.c \
            examples/ch32v003/main.c \
            -Imoteos -Imoteos/port/ch32v \
            -I"$SDK/Core" -I"$SDK/Peripheral/inc" -I"$SDK/Debug" -I"$USER"

  qemu-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchains
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi qemu-system-arm

      - name: Build smoke test (Cortex-M3, stm32vldiscovery)
        run: |
          arm-none-eabi-gcc -std=c99 -Wall -Wextra -Werror -Os -mcpu=cortex-m3 -mthumb \
            -ffreestanding -nostdlib -T tests/qemu/cm3/link.ld \
            -o /tmp/moteos_qemu.elf \
            tests/qemu/cm3/main.c tests/qemu/cm3/startup.c \
            moteos/mote.c moteos/mote_task.c moteos/mote_mail.c moteos/port/mote_port.c \
            -Imoteos -Imoteos/port/cm3

      - name: Run in QEMU (boot, vectors, SysTick, timer→event flow)
        run: |
          # 判定靠 stdout 的 QEMU_PASS/QEMU_FAIL 关键字（semihosting 退出码
          # 在各平台透传不一致）；向量表/SysTick 断掉时死循环 → timeout 判失败
          timeout 60s qemu-system-arm -M stm32vldiscovery -cpu cortex-m3 \
            -nographic -monitor none \
            -semihosting-config enable=on,target=native \
            -kernel /tmp/moteos_qemu.elf 2>&1 | tee /tmp/qemu.log
          grep -q "QEMU_PASS" /tmp/qemu.log || { echo "smoke test failed"; exit 1; }
          ! grep -q "QEMU_FAIL" /tmp/qemu.log || { echo "smoke test reported failure"; exit 1; }

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build-cov -DCMAKE_C_FLAGS="-Werror --coverage -O0"

      - name: Build
        run: cmake --build build-cov

      - name: Test
        run: ctest --test-dir build-cov --output-on-failure

      - name: Coverage report (fail under 85% lines)
        run: |
          pip install gcovr
          gcovr --root . --exclude tests --exclude 'build.*' \
            --fail-under-line 85 --print-summary

  cppcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install cppcheck
        run: sudo apt-get update && sudo apt-get install -y cppcheck

      - name: Static analysis (warning/performance/portability)
        run: |
          cppcheck --enable=warning,performance,portability --std=c99 \
            --inline-suppr --error-exitcode=1 \
            -Imoteos -Imoteos/port/host -Itests moteos
